<title id="title">Roots : boucle de jeu et intelligence des ennemis</title><desc id="desc">L’exploration conduit aux quêtes ou aux autels, puis à la progression et au boss. Une machine à états pilote les ennemis entre patrouille, poursuite et attaque.</desc>
