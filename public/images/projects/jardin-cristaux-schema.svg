<circle cx="333" cy="431" r="125" fill="none" stroke="#0b7a75" stroke-width="2" stroke-dasharray="7 7"/>
<path d="M333 431h125" stroke="#0b7a75" stroke-width="3" marker-end="url(#arrow)"/><text x="375" y="411" font-size="20" font-weight="700">r min.</text>
<g stroke="#664ac0" stroke-width="2"><path d="m277 253-20 37 20 22 20-22z" fill="#bda4f2"/><path d="m475 378-20 37 20 22 20-22z" fill="#bda4f2"/><path d="m680 578-20 37 20 22 20-22z" fill="#bda4f2"/></g>
<rect x="500" y="545" width="112" height="125" rx="16" fill="#ffdd85" stroke="#9a4f05" stroke-dasharray="6 5"/><text x="517" y="595" font-size="18">Zone de</text><text x="529" y="623" font-size="18">dépôt</text>
<rect x="85" y="663" width="175" height="34" rx="17" fill="#fffaf1"/><text x="102" y="686" font-size="16">Vue de principe XZ</text>
<g fill="#ffffff" stroke="#d6d7d2"><rect x="825" y="225" width="510" height="100" rx="16"/><rect x="825" y="350" width="510" height="100" rx="16"/><rect x="825" y="475" width="510" height="100" rx="16"/><rect x="825" y="600" width="510" height="115" rx="16"/></g>
<g font-size="24" font-weight="700"><text x="853" y="265">01 · Générer</text><text x="853" y="390">02 · Filtrer et peupler</text><text x="853" y="515">03 · Saisir et déposer</text><text x="853" y="640">04 · Rejouer ou régénérer</text></g>
<g font-size="20" fill="#3f4554"><text x="853" y="298">Graine → Bridson → points espacés</text><text x="853" y="423">Zones réservées, cristaux, végétation</text><text x="853" y="548">Le relâchement valide la collecte</text><text x="853" y="673">Graine et espacement via les boutons XR</text></g>
<path d="M1080 326v23m0 102v23m0 102v23" stroke="#0b7a75" stroke-width="2" marker-end="url(#arrow)"/>
<text x="65" y="774" font-size="21" font-weight="700" fill="#0b7a75">REPRODUCTIBILITÉ + CONTRÔLE DE LA DENSITÉ</text>
<text x="65" y="810" font-size="18" fill="#5a6170">Schéma pédagogique, pas une capture du jeu. L’espacement seul ne garantit pas un chemin praticable.</text>
