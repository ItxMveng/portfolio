<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc">
<title id="title">Jardin des cristaux : du point généré à l’interaction VR</title><desc id="desc">Schéma explicatif : une graine alimente Bridson, les points respectent une distance minimale, les zones réservées sont exclues, puis les cristaux sont collectés en VR.</desc>
<defs><pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#0b7a75" stroke-opacity=".12"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="m0 0 8 4-8 4z" fill="#0b7a75"/></marker></defs>
