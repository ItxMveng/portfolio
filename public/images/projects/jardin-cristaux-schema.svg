<g font-family="Arial,sans-serif" fill="#14171f">
<text x="65" y="63" font-size="18" font-weight="700" fill="#0b7a75" letter-spacing="3">UNITY · C# · INTERACTIONS XR</text>
<text x="65" y="132" font-size="52" font-weight="700">Jardin des cristaux</text>
<text x="65" y="177" font-size="23" fill="#3f4554">Une même graine. Des sites espacés. Un monde à manipuler.</text>
<rect x="65" y="225" width="710" height="490" rx="20" fill="#e8f2ec" stroke="#bad1c7"/>
<rect x="85" y="245" width="670" height="450" fill="url(#grid)"/>
